global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: "cloud-vm-python-exporter"
    static_configs:
      - targets:
          - "host.docker.internal:8000"
